name: Проверка сборки проекта

"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-test:
    name: Full check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 21
        run: |
          apt-get update
          apt-get -y install openjdk-21-jdk-headless

      - name: Install sbt 2.0.12
        run: |
          curl -fLo /tmp/sbt.tgz "https://github.com/sbt/sbt/releases/download/v2.0.12/sbt-2.0.12.tgz"
          mkdir -p /opt/sbt
          tar -xzf /tmp/sbt.tgz -C /opt/sbt --strip-components=1
          ln -sf /opt/sbt/bin/sbt /usr/local/bin/sbt
          /opt/sbt/bin/sbt --script-version

      - name: Build and Test
        run: sbt fullCheck

      - name: Site generation
        run: sbt site