name: Проверка сборки проекта

"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  SBT_BOOT_URL: ${{ vars.SBT_BOOT_URL }}

jobs:
  build-test:
    name: Full check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 21
        run: |
          apt-get update
          apt-get -y install openjdk-21-jdk-headless

      - name: Install sbt launcher
        run: |
          apt-get update
          apt-get -y install curl
          curl -fsSL "https://github.com/sbt/sbt/releases/download/v2.0.12/sbt-2.0.12.tgz" -o /tmp/sbt.tgz
          tar -C /opt -xzf /tmp/sbt.tgz
          ln -s /opt/sbt/bin/sbt /usr/local/bin/sbt

      - name: Install sbt 2.0.12 distribution (offline boot)
        run: |
          if [ -z "$SBT_BOOT_URL" ]; then
            echo "ERROR: SBT_BOOT_URL is not set."
            echo "Upload the sbt 2.0.12 boot tarball (scala-3.8.4/{lib, org.scala-sbt}) as a"
            echo "release/artifact and set SBT_BOOT_URL to its download URL, e.g."
            echo "https://gitverse.ru/.../releases/download/sbt-boot/scala-3.8.4.tgz"
            echo "The runner has NO access to Maven Central / org.scala-sbt, so a local"
            echo "boot distribution is required for sbt to start."
            exit 1
          fi
          mkdir -p "$HOME/.sbt/boot/scala-3.8.4"
          curl -fsSL "$SBT_BOOT_URL" -o /tmp/sbt-boot.tgz
          tar -xzf /tmp/sbt-boot.tgz -C "$HOME/.sbt/boot/scala-3.8.4"
          test -f "$HOME/.sbt/boot/scala-3.8.4/org.scala-sbt/sbt/2.0.12/sbt-2.0.12.jar"
          echo "sbt 2.0.12 boot distribution installed (offline)"

      - name: Configure Maven mirror
        run: |
          mkdir -p "$HOME/.config/coursier"
          cat > "$HOME/.config/coursier/mirror.properties" <<'EOF'
          https://repo1.maven.org/maven2 => https://mvn-mirror.gitverse.ru/
          https://repo.maven.apache.org/maven2 => https://mvn-mirror.gitverse.ru/
          EOF
          cat "$HOME/.config/coursier/mirror.properties"

      - name: Build and Test
        run: sbt -Dsbt.boot.directory="$HOME/.sbt/boot" -Dsbt.server.autostart=true fullCheck

      - name: Site generation
        run: sbt -Dsbt.boot.directory="$HOME/.sbt/boot" -Dsbt.server.autostart=true site