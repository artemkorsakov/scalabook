version = "3.11.5"

align.preset = more

runner.dialect = scala3

newlines.source = keep

rewrite {
  rules = [
    RedundantParens
  ]
  scala3.convertToNewSyntax = true
  scala3.removeOptionalBraces = true
  scala3.insertEndMarkerMinLines = 20
}

project.excludePaths = ["glob:**metals.sbt", "glob:**Dependencies.scala"]
